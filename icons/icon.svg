<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2133"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b768a"/>
      <stop offset="1" stop-color="#2c3340"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aac8ff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#aac8ff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#aac8ff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="b" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#b9d4ff"/><stop offset=".5" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d3f8f"/>
    </radialGradient>
    <radialGradient id="y" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff6bf"/><stop offset=".5" stop-color="#facc15"/><stop offset="1" stop-color="#a16207"/>
    </radialGradient>
    <radialGradient id="r" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ffc4c4"/><stop offset=".5" stop-color="#ef4444"/><stop offset="1" stop-color="#8b1c1c"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- szkło -->
  <path d="M186 132 L186 162 Q124 172 124 214 L124 384 Q124 420 160 420 L352 420 Q388 420 388 384 L388 214 Q388 172 326 162 L326 132 Z"
        fill="url(#glass)"/>

  <!-- kulki -->
  <g>
    <circle cx="164" cy="383" r="30" fill="url(#b)"/>
    <circle cx="226" cy="385" r="30" fill="url(#r)"/>
    <circle cx="288" cy="385" r="30" fill="url(#y)"/>
    <circle cx="349" cy="383" r="30" fill="url(#b)"/>
    <circle cx="195" cy="331" r="30" fill="url(#y)"/>
    <circle cx="257" cy="331" r="30" fill="url(#b)"/>
    <circle cx="319" cy="331" r="30" fill="url(#r)"/>
    <circle cx="226" cy="277" r="30" fill="url(#b)"/>
    <circle cx="288" cy="277" r="30" fill="url(#y)"/>
    <g fill="#fff" fill-opacity=".55">
      <ellipse cx="153" cy="371" rx="7" ry="4" transform="rotate(-35 153 371)"/>
      <ellipse cx="215" cy="373" rx="7" ry="4" transform="rotate(-35 215 373)"/>
      <ellipse cx="277" cy="373" rx="7" ry="4" transform="rotate(-35 277 373)"/>
      <ellipse cx="338" cy="371" rx="7" ry="4" transform="rotate(-35 338 371)"/>
      <ellipse cx="184" cy="319" rx="7" ry="4" transform="rotate(-35 184 319)"/>
      <ellipse cx="246" cy="319" rx="7" ry="4" transform="rotate(-35 246 319)"/>
      <ellipse cx="308" cy="319" rx="7" ry="4" transform="rotate(-35 308 319)"/>
      <ellipse cx="215" cy="265" rx="7" ry="4" transform="rotate(-35 215 265)"/>
      <ellipse cx="277" cy="265" rx="7" ry="4" transform="rotate(-35 277 265)"/>
    </g>
  </g>

  <!-- krawędź szkła i odblask -->
  <path d="M186 132 L186 162 Q124 172 124 214 L124 384 Q124 420 160 420 L352 420 Q388 420 388 384 L388 214 Q388 172 326 162 L326 132"
        fill="none" stroke="#d2e1ff" stroke-opacity=".6" stroke-width="8" stroke-linejoin="round"/>
  <rect x="142" y="210" width="14" height="120" rx="7" fill="url(#shine)"/>

  <!-- pokrywka -->
  <rect x="176" y="96" width="160" height="42" rx="10" fill="url(#lid)"/>
  <path d="M184 110 H328 M184 124 H328" stroke="#fff" stroke-opacity=".1" stroke-width="3"/>
</svg>
